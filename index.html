<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mystery Watch List</title>
<meta name="description" content="Every mystery show we follow, where it streams, and where we are in it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#eef0f2; --panel:#ffffff; --fg:#1b2533; --muted:#5d6878; --line:#d5dae1;
  --accent:#1f4a7a; --accent-soft:#e3ebf5; --tag:#f3d25b; --tag-fg:#3a2f00;
  --ok:#2f7a4f; --ok-soft:#e2f1e7; --warn:#9a5a00; --warn-soft:#fbeedb; --off:#7a7f88; --off-soft:#eceef1;
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Source Sans 3",-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12171e; --panel:#1a212b; --fg:#e6eaf0; --muted:#98a3b3; --line:#2c3541;
  --accent:#8db4e2; --accent-soft:#1f2c3d; --tag:#e7c548; --tag-fg:#2a2200;
  --ok:#7cc79b; --ok-soft:#1b3326; --warn:#e8b46a; --warn-soft:#3a2c17; --off:#9aa1ab; --off-soft:#242b35; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,5vw,2.6rem);margin:0;line-height:1.1;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.summary{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.92rem;color:var(--muted)}
.summary b{color:var(--fg);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--panel);color:var(--fg);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.filters button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.platform{display:flex;flex-direction:column;gap:10px}
h2{font-family:var(--f-display);font-weight:400;font-size:1.35rem;margin:0;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--f-body);font-size:.85rem;color:var(--muted)}
details.show{background:var(--panel);border:1px solid var(--line);border-radius:10px}
details.show>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
details.show>summary::-webkit-details-marker{display:none}
.name{font-weight:700;font-size:1.05rem;min-width:0}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.88rem;color:var(--muted)}
.pill{font-size:.76rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;white-space:nowrap}
.pill.airing{background:var(--ok-soft);color:var(--ok)}
.pill.coming{background:var(--warn-soft);color:var(--warn)}
.pill.waiting{background:var(--accent-soft);color:var(--accent)}
.pill.ended{background:var(--off-soft);color:var(--off)}
.tag{background:var(--tag);color:var(--tag-fg);font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:3px}
.count{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.body{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:12px}
.note{margin:0;font-size:.92rem;color:var(--muted);max-width:68ch}
.note b{color:var(--fg)}
.season{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
ul.eps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.eps li{display:grid;grid-template-columns:auto 4.2rem 1fr auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
ul.eps li:last-child{border-bottom:0}
ul.eps input{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;margin:0}
.code{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.title{min-width:0}
.date{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
li.done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
li.future .title,li.future .code{opacity:.55}
li.next .title::after{content:"Up next";margin-left:8px;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.state{padding:28px 18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center}
footer{font-size:.84rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
footer button{font:inherit;font-size:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.unlock{background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.unlock[hidden]{display:none}
.unlock label{font-weight:600}
.unlock-row{display:flex;flex-wrap:wrap;gap:8px}
.unlock input{font:inherit;flex:1 1 180px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.unlock button{font:inherit;font-size:.92rem;padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.unlock button.ghost{background:none;color:var(--accent)}
.unlock .msg{margin:0;font-size:.88rem;color:var(--warn);min-height:1em}
.remove{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-top:1px dashed var(--line);padding-top:10px;font-size:.9rem;color:var(--muted)}
button.link{font:inherit;font-size:.9rem;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline}
.remove button.link{color:var(--muted)}
button.danger{font:inherit;font-size:.88rem;padding:5px 12px;border-radius:6px;border:1px solid #b3261e;background:#b3261e;color:#fff;cursor:pointer}
details.removed{border:1px dashed var(--line);border-radius:10px;padding:10px 16px;color:var(--muted)}
details.removed summary{cursor:pointer;font-weight:600}
details.removed ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
details.removed li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px dashed var(--line);color:var(--fg)}
details.removed small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px)}
@media (max-width:480px){ul.eps li{grid-template-columns:auto 3.6rem 1fr}.date{grid-column:3}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mystery Watch List</h1>
    <p class="sub">Every show we follow, where it streams, and where we are in it. Tick an episode once we've watched it; the list is shared, so we both see the same ticks.</p>
    <div class="summary" id="summary"></div>
  </header>
  <form class="unlock" id="unlock" hidden>
    <label for="code">Enter the passcode to tick episodes</label>
    <div class="unlock-row"><input id="code" type="password" autocomplete="current-password" required><button type="submit">Unlock</button><button type="button" id="cancel" class="ghost">Cancel</button></div>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <div class="filters" id="filters" role="group" aria-label="Filter by service"></div>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>

const PLATFORMS=["Acorn TV","BritBox","HBO Max","Netflix","Apple TV"];
// Shared ticks live in Firestore (project mystery-watch-list). Anyone can read; writing needs the passcode,
// which the database's security rules check. The passcode is never stored in the database.
const DB="projects/mystery-watch-list/databases/(default)/documents", API="https://firestore.googleapis.com/v1/";
const CODE_KEY="mystery-watch-list:code", OPEN_KEY="mystery-watch-list:open";
let shows=SHOWS, filter="All", watched={}, removed=new Set(), openSet=new Set(), loaded=false, loadErr=false, pending=null, confirming=null;
let code=""; try{code=localStorage.getItem(CODE_KEY)||""}catch(e){}
try{openSet=new Set(JSON.parse(localStorage.getItem(OPEN_KEY)||"[]"))}catch(e){}
const busy={};
async function load(){
  try{
    const r=await fetch(API+DB+"/watched?pageSize=300",{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json(), next={}, nextRemoved=new Set();
    for(const d of j.documents||[]){const id=d.name.split("/").pop(), f=d.fields?.eps?.mapValue?.fields||{};
      next[id]=Object.fromEntries(Object.entries(f).map(([k,v])=>[k,v.stringValue||"1"]));
      if(d.fields?.removed?.booleanValue)nextRemoved.add(id)}
    for(const sid in busy)if(busy[sid]){next[sid]=watched[sid];removed.has(sid)?nextRemoved.add(sid):nextRemoved.delete(sid)}  // keep in-flight edits
    if(pending){next[pending.sid]=watched[pending.sid];removed.has(pending.sid)?nextRemoved.add(pending.sid):nextRemoved.delete(pending.sid)}
    watched=next;removed=nextRemoved;loaded=true;loadErr=false;
  }catch(e){loadErr=true}
  render();
}
async function save(sid){
  const eps=watched[sid]||{};
  const writes=[{update:{name:`${DB}/gate/${encodeURIComponent(code)}`,fields:{}},updateTransforms:[{fieldPath:"t",setToServerValue:"REQUEST_TIME"}]},
    {update:{name:`${DB}/watched/${sid}`,fields:{eps:{mapValue:{fields:Object.fromEntries(Object.entries(eps).map(([k,v])=>[k,{stringValue:v}]))}},removed:{booleanValue:removed.has(sid)},updated:{stringValue:new Date().toISOString()}}}}];
  const r=await fetch(API+DB+":commit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({writes})});
  if(r.status===403)throw Object.assign(new Error("denied"),{denied:true});
  if(!r.ok)throw new Error(r.status);
}
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),3500)}
function askCode(msg){const f=document.getElementById("unlock");f.hidden=false;document.getElementById("msg").textContent=msg||"";const i=document.getElementById("code");i.value="";i.focus()}
const snap=sid=>({eps:{...(watched[sid]||{})},rem:removed.has(sid)});
const restore=(sid,b)=>{watched[sid]=b.eps;b.rem?removed.add(sid):removed.delete(sid)};
// Apply a change to one show locally, then save it; on failure put it back.
async function change(sid,mutate,doneMsg){
  const before=snap(sid);mutate();render();
  if(!code){pending={sid,before,doneMsg};askCode();return}
  while(busy[sid])await busy[sid];
  busy[sid]=save(sid).then(()=>{if(doneMsg)toast(doneMsg)}).catch(err=>{
      if(err.denied){code="";try{localStorage.removeItem(CODE_KEY)}catch(_){}pending={sid,before,doneMsg};askCode("The passcode has changed. Enter the new one.")}
      else{restore(sid,before);render();toast("Couldn't save. Check your connection and try again.")}
    }).finally(()=>{busy[sid]=null});
}
const d=new Date(), today=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=x=>{if(!x)return"";const t=new Date(x+"T12:00:00");return isNaN(t)?x:t.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})};

function render(){
  document.getElementById("filters").innerHTML=["All",...PLATFORMS,"New to watch"].map(p=>`<button type="button" data-f="${p}" aria-pressed="${p===filter}">${p}</button>`).join("");
  let totalEps=0,totalDone=0,newCount=0;const byP={};
  const active=shows.filter(s=>!removed.has(s.id)), gone=shows.filter(s=>removed.has(s.id));
  for(const s of active){
    const w=watched[s.id]||{};
    const released=s.episodes.filter(e=>!e.date||e.date<=today);
    s._done=s.episodes.filter(e=>w[e.code]).length;
    s._new=released.filter(e=>!w[e.code]).length;
    totalEps+=released.length;totalDone+=released.filter(e=>w[e.code]).length;if(s._new)newCount++;
    if(filter==="All"||s.platform===filter||(filter==="New to watch"&&s._new>0))(byP[s.platform]=byP[s.platform]||[]).push(s);
  }
  document.getElementById("summary").innerHTML=`<span><b>${active.length}</b> shows</span><span><b>${totalDone}</b> of <b>${totalEps}</b> released episodes watched</span><span><b>${newCount}</b> shows with something unwatched</span>`;
  let html="";
  for(const p of PLATFORMS){
    const arr=(byP[p]||[]).sort((a,b)=>(a.order??99)-(b.order??99));
    if(!arr.length)continue;
    html+=`<section class="platform"><h2>${esc(p)}<small>${arr.length} show${arr.length>1?"s":""}</small></h2>${arr.map(showHTML).join("")}</section>`;
  }
  if(!html)html='<div class="state">Nothing matches this filter.</div>';
  if(gone.length)html+=`<details class="removed"${openSet.has("__removed")?" open":""} data-id="__removed"><summary>Removed shows (${gone.length})</summary><ul>${gone.map(s=>`<li><span>${esc(s.name)} <small>${esc(s.platform)}</small></span><button type="button" class="link" data-restore="${s.id}">Put back</button></li>`).join("")}</ul></details>`;
  document.getElementById("list").innerHTML=html;
  const last=shows.map(s=>s.checked).filter(Boolean).sort().pop();
  const status=loadErr?"Couldn't reach the shared list; showing what was last loaded.":(!loaded?"Loading shared ticks…":"");
  document.getElementById("foot").innerHTML=[status&&`<span>${esc(status)}</span>`,last&&`<span>Episode info last checked ${esc(fmt(last))}.</span>`,code?`<button type="button" id="lock">Lock this device</button>`:""].filter(Boolean).join("");
}
function showHTML(s){
  const w=watched[s.id]||{}, n=s.episodes.length, pct=n?Math.round(s._done/n*100):0;
  const pillCls={airing:"airing",coming:"coming",waiting:"waiting",ended:"ended"}[s.status]||"waiting";
  const pillTxt={airing:"Airing now",coming:"New season soon",waiting:"Between seasons",ended:"Ended"}[s.status]||"Between seasons";
  const nextEp=s.episodes.find(e=>!w[e.code]&&(!e.date||e.date<=today));
  const seasons={};for(const e of s.episodes){const k=e.season||"";(seasons[k]=seasons[k]||[]).push(e)}
  let eps="";
  for(const [k,arr] of Object.entries(seasons)){
    if(Object.keys(seasons).length>1||k)eps+=`<p class="season">${esc(k)}</p>`;
    eps+=`<ul class="eps">`+arr.map(e=>{
      const done=!!w[e.code], fut=e.date&&e.date>today, nx=nextEp&&nextEp.code===e.code, id=`ep-${s.id}-${e.code}`;
      return `<li class="${done?"done":""} ${fut?"future":""} ${nx?"next":""}"><input type="checkbox" id="${id}" data-show="${s.id}" data-ep="${esc(e.code)}" ${done?"checked":""} aria-label="Watched ${esc(s.name)} ${esc(e.code)}"><label class="code" for="${id}">${esc(e.code)}</label><label class="title" for="${id}">${esc(e.title||"Episode")}</label><span class="date">${fut?"Out ":""}${fmt(e.date)}</span></li>`}).join("")+`</ul>`;
  }
  return `<details class="show" data-id="${s.id}" ${openSet.has(s.id)?"open":""}><summary>
    <span class="name">${esc(s.name)}</span><span class="count">${s._done}/${n}</span>
    <span class="meta"><span class="pill ${pillCls}">${pillTxt}</span>${s._new?`<span class="tag">${s._new} unwatched</span>`:""}<span>${esc(s.latest||"")}</span></span>
    <span class="bar"><i style="width:${pct}%"></i></span></summary>
    <div class="body">${s.note?`<p class="note">${s.note}</p>`:""}${eps}
    <div class="remove">${confirming===s.id
      ?`<span>Remove ${esc(s.name)} from the list for both of you? Ticks are kept if you put it back.</span><button type="button" class="danger" data-remove-yes="${s.id}">Remove</button><button type="button" class="link" data-remove-no>Keep</button>`
      :`<button type="button" class="link" data-remove="${s.id}">Remove show</button>`}</div></div></details>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-f]");if(b){filter=b.dataset.f;render();return}
  if(e.target.id==="lock"){code="";try{localStorage.removeItem(CODE_KEY)}catch(_){}render();toast("Locked. Ticking will ask for the passcode again.")}
  if(e.target.id==="cancel"){if(pending){restore(pending.sid,pending.before);pending=null;render()}document.getElementById("unlock").hidden=true}
  const t=e.target.closest("[data-remove],[data-remove-yes],[data-remove-no],[data-restore]");if(!t)return;
  e.preventDefault();
  if(t.dataset.remove){confirming=t.dataset.remove;render()}
  else if("removeNo" in t.dataset){confirming=null;render()}
  else if(t.dataset.removeYes){const sid=t.dataset.removeYes, s=shows.find(x=>x.id===sid);confirming=null;openSet.delete(sid);
    change(sid,()=>removed.add(sid),`Removed ${s.name}. Put it back from "Removed shows" at the bottom.`)}
  else if(t.dataset.restore){const sid=t.dataset.restore, s=shows.find(x=>x.id===sid);change(sid,()=>removed.delete(sid),`${s.name} is back on the list.`)}
});
document.getElementById("unlock").addEventListener("submit",async e=>{
  e.preventDefault();
  const tryCode=document.getElementById("code").value.trim();if(!tryCode)return;
  if(!pending){document.getElementById("unlock").hidden=true;return}
  const prev=code;code=tryCode;
  const {sid,before,doneMsg}=pending;
  try{await save(sid);try{localStorage.setItem(CODE_KEY,code)}catch(_){}
    pending=null;document.getElementById("unlock").hidden=true;render();toast(doneMsg||"Unlocked on this device.")}
  catch(err){code=prev;if(err.denied)askCode("That passcode didn't work. Try again.");else{restore(sid,before);pending=null;document.getElementById("unlock").hidden=true;render();toast("Couldn't save. Check your connection and try again.")}}
});
document.addEventListener("toggle",e=>{const el=e.target;if(!el.matches||!el.matches("details.show,details.removed"))return;
  el.open?openSet.add(el.dataset.id):openSet.delete(el.dataset.id);try{localStorage.setItem(OPEN_KEY,JSON.stringify([...openSet]))}catch(_){}},true);
document.addEventListener("change",async e=>{
  const cb=e.target;if(!cb.matches("input[data-show]"))return;
  const sid=cb.dataset.show, ep=cb.dataset.ep, on=cb.checked;
  change(sid,()=>{const cur={...(watched[sid]||{})};if(on)cur[ep]=today;else delete cur[ep];watched[sid]=cur});
});
render();load();
setInterval(()=>{if(!document.hidden)load()},20000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
